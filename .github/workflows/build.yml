name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair o zip
        run: unzip -q open-jarvis-main.zip -d projeto
      - name: Verificar versão corrigida
        run: test -f projeto/open-jarvis-main/app/src/main/java/com/openjarvis/ui/theme/Theme.kt || (echo "ZIP ERRADO - envie o open-jarvis-android.zip corrigido" && exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Compilar APK
        working-directory: projeto/open-jarvis-main
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-apk
          path: projeto/open-jarvis-main/app/build/outputs/apk/debug/app-debug.apk
